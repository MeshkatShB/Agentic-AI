<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Agent - Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>AI Agent Assistant Settings</h1>
        <p class="subtitle">Configure your AI agent extension</p>
      </div>

      <div class="section">
        <h2>Backend Configuration</h2>
        <div class="form-group">
          <label for="backendUrl">Backend URL</label>
          <input
            type="text"
            id="backendUrl"
            placeholder="http://localhost:8000"
            value="http://localhost:8000"
          />
          <small>URL of your local AI agent backend server</small>
        </div>

        <div class="form-group">
          <button id="testConnection" class="button-secondary">
            Test Connection
          </button>
          <span id="connectionStatus"></span>
        </div>
      </div>

      <div class="section">
        <h2>Authentication</h2>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />
        </div>

        <div class="form-group">
          <button id="loginButton" class="button-primary">Login</button>
          <button
            id="logoutButton"
            class="button-secondary"
            style="display: none"
          >
            Logout
          </button>
          <span id="authStatus"></span>
        </div>
      </div>

      <div class="section">
        <h2>Options</h2>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoCapture" />
            <span>Auto-capture page content on load</span>
          </label>
          <small
            >Automatically extract page content when you visit a new page</small
          >
        </div>
      </div>

      <div class="section">
        <div class="form-group">
          <button id="saveButton" class="button-primary">Save Settings</button>
          <button id="resetButton" class="button-secondary">
            Reset to Defaults
          </button>
        </div>
      </div>

      <div id="statusMessage" class="status-message"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
