<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield background -->
  <path d="M50 10 L80 25 L80 60 Q80 85 50 90 Q20 85 20 60 L20 25 Z" 
        fill="url(#grad1)" 
        stroke="#0284c7" 
        stroke-width="2"
        filter="url(#glow)"/>
  
  <!-- Lock icon -->
  <g transform="translate(50, 45)">
    <!-- Lock body -->
    <rect x="-12" y="0" width="24" height="18" rx="2" fill="white" opacity="0.9"/>
    
    <!-- Lock shackle -->
    <path d="M -8 0 L -8 -8 Q -8 -16 0 -16 Q 8 -16 8 -8 L 8 0" 
          fill="none" 
          stroke="white" 
          stroke-width="3" 
          stroke-linecap="round"
          opacity="0.9"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="7" r="2" fill="#0369a1"/>
    <rect x="-1" y="7" width="2" height="6" fill="#0369a1"/>
  </g>
  
  <!-- AI indicator dots -->
  <circle cx="35" cy="70" r="2" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="70" r="2" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="70" r="2" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
