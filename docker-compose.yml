services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: local-agent-backend
    ports:
      - "3333:3333"
    volumes:
      - ./db:/app/db
      - ./chroma_db:/app/chroma_db
      - ./user_documents:/app/user_documents
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./db/local_agent.db}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - VECTOR_STORE=${VECTOR_STORE:-chroma}
      - CHROMA_PATH=/app/chroma_db
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
    # Remove depends_on: ollama if using host's Ollama
    # depends_on:
    #   - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: local-agent-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama LLM Service (optional - use if Ollama is not running on host)
  # To use host's Ollama instead, set OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env
  ollama:
    image: ollama/ollama:0.3.15
    container_name: local-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ollama-docker
    # Uncomment below for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Qdrant vector database (optional - use if not using Chroma)
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: local-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    profiles:
      - qdrant
    restart: unless-stopped

  # SearxNG for private web search (optional)
  searxng:
    image: searxng/searxng:latest
    container_name: local-agent-searxng
    ports:
      - "8888:8080"
    volumes:
      - searxng_data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    profiles:
      - search
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  searxng_data:
